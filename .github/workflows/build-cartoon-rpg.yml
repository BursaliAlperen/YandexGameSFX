name: Build Cartoon RPG SFX ZIP
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 cartoon/RPG packs
        run: |
          mkdir -p build/cartoon-rpg
          curl -L --fail "https://opengameart.org/sites/default/files/80-CC0-creature-SFX.zip" -o build/cartoon-rpg/80-CC0-creature-SFX.zip
          curl -L --fail "https://lpc.opengameart.org/sites/default/files/zombies.zip" -o build/cartoon-rpg/zombies.zip
          curl -L --fail "https://opengameart.org/sites/default/files/Voice%20Effects%20Zombie-Skeleton-Monster%20Human%20Male.zip" -o build/cartoon-rpg/zombie-skeleton-monster-voices.zip
          curl -L --fail "https://opengameart.org/sites/default/files/80-CC0-RPG-SFX.zip" -o build/cartoon-rpg/80-CC0-RPG-SFX.zip
          curl -L --fail "https://opengameart.org/sites/default/files/27-Metal-Audio-Samples-blacklodgegames.com_.zip" -o build/cartoon-rpg/27-Metal-Audio-Samples.zip
      - name: Build single ZIP
        run: |
          cp CARTOON_RPG_CC0.md build/cartoon-rpg/
          zip -r YandexGameSFX-Cartoon-RPG-CC0.zip build/cartoon-rpg
      - uses: actions/upload-artifact@v4
        with:
          name: YandexGameSFX-Cartoon-RPG-CC0
          path: YandexGameSFX-Cartoon-RPG-CC0.zip
